name: deterministic-floor
on:
  push:
    branches: [main]
  pull_request:

# The workflow needs repository contents only. Third-party actions are pinned
# to immutable commits; the comments retain the human-readable release names.
# GitHub's hosted ubuntu-24.04 image/toolcache, its actions download service,
# and PyPI over TLS remain mutable external trust roots.
#
# Platform coverage: the matrix runs Linux and Windows (sprint 2, F7 —
# floor-structure-residue item 6). The Windows leg exercises the command
# carriers, the sh interpreter resolver under Git Bash, and the line-ending
# contract on hosted runners; until its first green run is observed after
# publication, Windows evidence remains operator-machine measurement
# (tools/tests/README.md, "Platform coverage").
permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      # The interpreter is pinned per OS, not shared. Linux runs 3.12.13 —
      # the reference machine's own version, so CI mirrors where the budgets
      # are measured. Windows cannot: actions/python-versions ships win32-x64
      # builds of 3.12 only up to 3.12.10, because 3.12 is in security-only
      # mode and upstream no longer publishes Windows installers for it, so
      # 3.12.11+ are Linux-only in the manifest. 3.12.10 is therefore the
      # newest 3.12 that exists for this runner, and the legs differing by
      # patch level is the honest state, not a compromise to hide. Moving
      # both legs to a branch that still ships Windows builds (3.13) is a
      # deliberate runtime decision, not a CI repair.
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.12.13"
          - os: windows-2025
            python: "3.12.10"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # provenance pins resolve against full history
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --requirement requirements-ci.txt
      # pytest's temp tree must sit on the SAME DRIVE as the checkout. On
      # hosted Windows runners the workspace is D:\a\... while TEMP is on
      # C:\Users\runneradmin\..., and scaffold deliberately refuses a domain
      # it cannot reach by relative path ("refusing to embed an absolute
      # machine-specific adapter command") — so every scaffolding test fails
      # for an environment reason, not a floor defect. RUNNER_TEMP shares the
      # workspace drive and lives outside the repo, which keeps the scaffolded
      # fixtures out of the corpus walk the later steps perform. Verified by
      # the 2026-08-22 Windows run: 56 failures, one cause.
      - name: Floor self-tests (mdllm is what defines "valid" — test it first)
        run: python -m pytest tools/tests -q -n auto --basetemp="${{ runner.temp }}/pytest-basetemp"
      - name: Mechanical validation (includes version-sentinel sync)
        run: python tools/mdllm.py validate .
      - name: Provenance chains
        run: python tools/mdllm.py provenance .
      - name: Kernel drift
        run: python tools/mdllm.py kernel . --check
      - name: Index drift
        run: python tools/mdllm.py index . check
      - name: Catalog & label coherence (same checks the pre-commit hook runs)
        run: python tools/mdllm.py coherence .

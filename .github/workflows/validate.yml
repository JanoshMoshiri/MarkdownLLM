name: deterministic-floor
on:
  push:
    branches: [main]
  pull_request:

# The workflow needs repository contents only. Third-party actions are pinned
# to immutable commits; the comments retain the human-readable release names.
# GitHub's hosted ubuntu-24.04 image/toolcache, its actions download service,
# and PyPI over TLS remain mutable external trust roots.
#
# Platform coverage: the matrix runs Linux and Windows (sprint 2, F7 —
# floor-structure-residue item 6). The Windows leg exercises the command
# carriers, the sh interpreter resolver under Git Bash, and the line-ending
# contract on hosted runners; until its first green run is observed after
# publication, Windows evidence remains operator-machine measurement
# (tools/tests/README.md, "Platform coverage").
permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # provenance pins resolve against full history
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"
      - run: python -m pip install --requirement requirements-ci.txt
      - name: Floor self-tests (mdllm is what defines "valid" — test it first)
        run: python -m pytest tools/tests -q -n auto
      - name: Mechanical validation (includes version-sentinel sync)
        run: python tools/mdllm.py validate .
      - name: Provenance chains
        run: python tools/mdllm.py provenance .
      - name: Kernel drift
        run: python tools/mdllm.py kernel . --check
      - name: Index drift
        run: python tools/mdllm.py index . check
      - name: Catalog & label coherence (same checks the pre-commit hook runs)
        run: python tools/mdllm.py coherence .

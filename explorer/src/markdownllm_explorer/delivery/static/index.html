<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MarkdownLLM Explorer</title>
  <!-- No icon link: the content policy sets img-src 'none' so repository
       bytes can never render as an image, and that applies to this one too.
       The asset is still served, so the browser's automatic /favicon.ico
       request is answered rather than logged as an unknown route. -->
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/context.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="shell">
    <aside id="sidebar" class="sidebar" aria-label="Estate navigation">
      <header class="brand">
        <svg class="brand-mark" viewBox="18 20 128 96" aria-hidden="true" focusable="false">
          <path class="brand-blue" d="M24 48 H37 V93 C37 97 39 99 44 99 H77 V112 H41 C30 112 24 105 24 94 Z"/>
          <path class="brand-blue" d="M45 48 H58 V92 H45 Z"/>
          <path class="brand-blue" d="M65 48 H78 V92 H65 Z"/>
          <path class="brand-ink" d="M85 27 H122 C131 27 138 35 138 45 V91 H125 V47 C125 43 123 40 119 40 H85 Z"/>
          <path class="brand-ink" d="M85 47 H98 V91 H85 Z"/>
          <path class="brand-ink" d="M105 47 H118 V91 H105 Z"/>
        </svg>
        <span class="brand-copy"><strong>MarkdownLLM</strong><small>Explorer</small></span>
        <button id="sidebar-collapse" class="icon-button region-collapse" aria-label="Collapse navigation" aria-expanded="true" aria-controls="sidebar">‹</button>
        <button id="sidebar-close" class="icon-button overlay-only" aria-label="Close navigation">×</button>
      </header>
      <div class="sidebar-scroll">
        <nav id="source-nav" aria-label="Sources"></nav>
        <section class="file-section" aria-labelledby="files-label">
          <div class="section-heading"><span id="files-label">Source files</span><button id="tree-refresh" class="quiet-button">Refresh</button></div>
          <div id="file-tree" class="tree" role="tree"></div>
        </section>
      </div>
      <footer class="sidebar-footer"><span class="read-only-dot"></span>Read-only local view</footer>
    </aside>
    <main id="main" class="workspace" tabindex="-1">
      <header class="topbar">
        <button id="sidebar-open" class="icon-button region-toggle" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar">☰</button>
        <div class="source-title">
          <span id="source-icon" class="source-icon">S</span>
          <div><h1 id="source-name">Substrate</h1><p id="source-kind">Framework source</p></div>
        </div>
        <div class="top-actions">
          <label class="search-box"><span aria-hidden="true">⌕</span><span class="sr-only">Search source paths</span><input id="search-input" type="search" placeholder="Search files" autocomplete="off"></label>
          <button id="theme-toggle" class="icon-button" aria-label="Change colour theme">◐</button>
          <button id="context-open" class="icon-button region-toggle" aria-label="Open context panel" aria-expanded="false" aria-controls="context-panel">ⓘ</button>
        </div>
      </header>
      <nav class="tabs" aria-label="Source views" role="tablist">
        <button id="tab-overview" data-view="overview" class="active" role="tab" aria-controls="content" aria-selected="true" tabindex="0">Overview</button>
        <button id="tab-skills" data-view="skills" role="tab" aria-controls="content" aria-selected="false" tabindex="-1">Skills</button>
        <button id="tab-memory" data-view="memory" role="tab" aria-controls="content" aria-selected="false" tabindex="-1">Memory</button>
        <button id="tab-settings" data-view="settings" role="tab" aria-controls="content" aria-selected="false" tabindex="-1">Settings</button>
      </nav>
      <section id="notice" class="notice" hidden role="status"></section>
      <section id="content" class="content" role="tabpanel" aria-labelledby="tab-overview" aria-live="polite" tabindex="0"></section>
    </main>
    <aside id="context-panel" class="context-panel" aria-label="Source and document context">
      <header class="context-head"><strong>Context</strong><button id="context-collapse" class="icon-button region-collapse" aria-label="Collapse context panel" aria-expanded="true" aria-controls="context-panel">›</button><button id="context-close" class="icon-button overlay-only" aria-label="Close context panel">×</button></header>
      <div id="context-content" class="context-content"></div>
    </aside>
  </div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>

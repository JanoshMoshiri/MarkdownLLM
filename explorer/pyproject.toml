[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "markdownllm-explorer"
version = "0.1.0"
description = "A read-only local browser for a MarkdownLLM substrate and domain estate"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML==6.0.3"]
license = {text = "MIT"}

[project.scripts]
mdllm-explorer = "markdownllm_explorer.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
markdownllm_explorer = [
  "delivery/static/*.html",
  "delivery/static/*.css",
  "delivery/static/js/*.js",
  "delivery/static/js/views/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "unit: pure core/application tests",
  "architecture: dependency and replaceability fitness tests",
  "contract: adapter and API contracts",
  "gitfs: temporary real filesystem/git repositories",
  "system: installed/runtime HTTP tests",
  "performance: generated scale benchmark",
  "meta: traceability and deliberate-mutant tests",
]


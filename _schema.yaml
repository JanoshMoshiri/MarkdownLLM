# Normative domain schema — MarkdownLLM framework domain (transformation plan Phase 1).
# Read by tools/mdllm.py. Declares the types, status vocabularies, and relation
# vocabulary this domain permits. Framework-reserved types (specification, guide,
# manifesto, skill, prompt, insight, conflict, retrospective, continuity-brief,
# decision, workflow-definition, workflow-run, index) are built into the tool
# and need no declaration here — RESERVED_STATUSES in the tool is the authority;
# this comment lagged it by three types until the 2026-08-09 reconciliation.
schema_version: 1
domain: framework

options:
  # Framework spec files are named by topic (thing.md) with ids suffixed
  # -specification (thing-specification) — an established convention; links and
  # history depend on the ids. Domain things (things/**) do match filenames.
  id_filename_match: false
  # The session gate (validate.thing.md, v3.28.0): advisory at the framework
  # root — a commit without a fresh `mdllm session-start` attestation warns
  # rather than blocks, because release and CI flows legitimately commit here
  # outside a domain session. The regulated domains declare strict.
  session_gate: warn

types:
  plan:
    statuses: [not-started, in-progress, blocked, paused, completed, cancelled]
  artifact: # WORKLOG, REVIEWLOG — generated running records
    statuses: [evolving, stable, deprecated]

# Declared relation vocabulary (validated at Warning severity).
# Pruned 2026-06-12 (independent-review action 5): 35 -> 13. Inverse pairs
# collapsed to their forward direction (the link lives on the dependent thing;
# `supersedes`/`superseded-by` is the one pair kept, because the validator
# itself checks the backlink). Near-synonyms merged: integrates-with ->
# complements, enforces/evaluates -> validates, operationalises -> implements.
# Grow only when a real link needs a relation that isn't here.
relations:
  # semantic
  - informs        # source of reasoning or evidence for the target
  - implements     # realises the target's principle, contract, or ritual
  - extends        # builds on the target, adding fields or semantics
  - references     # cites the target; weakest directed link
  - complements    # adjacent concern; read together (symmetric)
  - documents      # running record of the target (WORKLOG, maps)
  - validates      # mechanically or semantically checks the target
  - supports       # evidence in favour (insights; belief revision)
  - challenges     # evidence against (insights; belief revision)
  - derived-from   # born from the target's work; the target is the evidence base
                   # (registered 2026-08-06 on third independent use: two 2026-08-05
                   # harvest insights and operating-is-programming all reached for it)
  # mechanical — fixed semantics, checked by mdllm validate / triggers
  - contradicts    # requires a type: conflict thing listing both parties
  - supersedes     # replaces the target's content
  - superseded-by  # inverse of supersedes; validator checks this backlink
  - subtask        # drives the subtasks_complete threshold trigger

# Declared frontmatter-field vocabulary (validated at Warning severity, opt-in).
# CORE_FIELDS (built into mdllm.py — id/type/status/created, the relational and
# trigger fields, provenance, generated-index frontmatter) are universal and
# need no declaration here; this list is the framework DOMAIN's emergent
# extension. A field used by a thing but in neither set is flagged as a typo or
# an unregistered field. Register a genuinely-new field here as part of the same
# write-cascade that introduces it — the judgment that it belongs is the point;
# never auto-sync. Bootstrap/audit the in-use set with
# `mdllm index . rebuild --signal schema`.
known_fields:
  - version         # spec/manifesto/skill semantic version
  - session         # session number a thing was created in
  - confidence      # insight confidence (belief-revision)
  - source          # insight/decision enum: who surfaced it (human|agent|both|build|operator).
                    # Ruled 2026-08-04 (framework-retrospective-2026-08a): domain provenance
                    # uses the core source_domain, never this field; free-text session
                    # descriptions belong in `session` + body. Pre-ruling free-text values
                    # on eval-era insights stand as historical records.
  - tags            # free classification
  - domain          # domain a thing belongs to
  - period_start    # retrospective / measurement window
  - period_end
  - last_updated    # hand-maintained freshness stamp
  - resolution      # conflict outcome
  - resolved_by     # conflict resolver (decision id)
  - decided_by      # decision author/authority
  - promoted_to     # insight -> spec promotion target
  - priority        # plan/task priority
  - completed       # ISO date a plan reached completed status (registered 2026-08-04, estate-cadence-cluster close — the field-registration sensor caught its own builder a third time)

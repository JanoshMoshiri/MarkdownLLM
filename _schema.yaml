# Normative domain schema — MarkdownLLM framework domain (transformation plan Phase 1).
# Read by tools/mdllm.py. Declares the types, status vocabularies, and relation
# vocabulary this domain permits. Framework-reserved types (specification, guide,
# manifesto, skill, prompt, insight, conflict, retrospective, continuity-brief,
# index) are built into the tool and need no declaration here.
schema_version: 1
domain: framework

options:
  # Framework spec files are named by topic (thing.md) with ids suffixed
  # -specification (thing-specification) — an established convention; links and
  # history depend on the ids. Domain things (things/**) do match filenames.
  id_filename_match: false

types:
  plan:
    statuses: [not-started, in-progress, blocked, paused, completed, cancelled]
  artifact: # WORKLOG, REVIEWLOG — generated running records
    statuses: [evolving, stable, deprecated]

# Declared relation vocabulary (validated at Warning severity).
# Pruned 2026-06-12 (independent-review action 5): 35 -> 13. Inverse pairs
# collapsed to their forward direction (the link lives on the dependent thing;
# `supersedes`/`superseded-by` is the one pair kept, because the validator
# itself checks the backlink). Near-synonyms merged: integrates-with ->
# complements, enforces/evaluates -> validates, operationalises -> implements.
# Grow only when a real link needs a relation that isn't here.
relations:
  # semantic
  - informs        # source of reasoning or evidence for the target
  - implements     # realises the target's principle, contract, or ritual
  - extends        # builds on the target, adding fields or semantics
  - references     # cites the target; weakest directed link
  - complements    # adjacent concern; read together (symmetric)
  - documents      # running record of the target (WORKLOG, maps)
  - validates      # mechanically or semantically checks the target
  - supports       # evidence in favour (insights; belief revision)
  - challenges     # evidence against (insights; belief revision)
  # mechanical — fixed semantics, checked by mdllm validate / triggers
  - contradicts    # requires a type: conflict thing listing both parties
  - supersedes     # replaces the target's content
  - superseded-by  # inverse of supersedes; validator checks this backlink
  - subtask        # drives the subtasks_complete threshold trigger

# Normative domain schema — compliance-patterns example domain.
# Read by tools/mdllm.py (the deterministic floor). Declares the thing types,
# status vocabularies, and relation vocabulary this domain permits.
# Framework-reserved types (skill, specification, guide, etc.) are built into
# the tool and not redeclared. `type: example` is NOT reserved — it is declared
# here with the document lifecycle these pattern things actually follow.
schema_version: 1
domain: compliance-patterns

options:
  # Skill files follow the framework's dotted naming convention
  # (compliance-patterns-read.thing.skill.md) while ids are plain kebab-case.
  id_filename_match: false

types:
  example:
    statuses: [draft, evolving, stable, deprecated]
  pattern:
    statuses: [draft, evolving, stable, deprecated]
  anti-pattern:
    statuses: [draft, evolving, stable, deprecated]
  decision-tree:
    statuses: [draft, evolving, stable, deprecated]

# Relation vocabulary (validated at Warning severity). The three
# domain-specific relations are the library's teaching mechanism:
# a violation is remediated-by its compliant counterpart, the counterpart
# contrasts-with the violation, and worked examples demonstrate patterns.
relations:
  - informs
  - implements
  - complements
  - references
  - related
  - contrasts-with   # compliant pattern <-> its violating counterpart
  - remediated-by    # anti-pattern -> the pattern that corrects it
  - demonstrates     # worked example -> the pattern it shows in action
  - orchestrates     # workflow skill sequencing other skills

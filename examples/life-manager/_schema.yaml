# Normative domain schema — life-manager example domain.
# Read by tools/mdllm.py (the deterministic floor). Declares the thing types,
# status vocabularies, and relation vocabulary this domain permits.
# Framework-reserved types are built into the tool and are not redeclared here —
# RESERVED_STATUSES in the tool is the authority on the set (13 types, including
# workflow-definition and workflow-run, both instantiated in this very corpus;
# an enumerated copy of the list here lagged the tool by two types while the
# corpus used both — a review-loop finding).
schema_version: 1
domain: life-manager

options:
  # Skill files follow the framework's dotted naming convention
  # (life-manager-read.thing.skill.md) while their ids are plain kebab-case.
  id_filename_match: false

types:
  project:
    statuses: [not-started, in-progress, blocked, paused, completed, cancelled]
  task:
    statuses: [not-started, in-progress, blocked, paused, completed, cancelled]
    required_fields: [priority]
  goal:
    statuses: [active, achieved, abandoned]
  recurring:
    statuses: [active, paused, retired]

# Relation vocabulary (validated at Warning severity). Kept deliberately small:
# hierarchy uses the `parent` field, sequencing uses `dependencies`/`blocks` —
# relations carry only what fields cannot.
relations:
  - informs       # source of reasoning for the target
  - implements    # realises the target's principle or contract
  - complements   # adjacent concern; read together
  - references    # cites the target
  - related       # generic association
  - subtask       # child of a project (drives the subtasks_complete trigger)
  - supports      # advances the referenced goal (domain-specific)
  - orchestrates  # workflow skill sequencing other skills (domain-specific)

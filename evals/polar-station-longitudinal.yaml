name: Polar station HTC-7 (longitudinal, hard)
description: 'A hard longitudinal fixture: a fictional polar-station heating code (HTC-7) with 15 clauses,
  7 modules sharing 5 constructions, and 6 chained fresh-agent sessions (build, single-module re-roof
  of a shared assembly, a revision with a boundary commissioning date and a clause that does not apply
  to this site, an operator request the code forbids, a retroactive erratum, a docking that turns an external
  wall into a party wall). The code is a plain document both arms read (standard/htc-7.md); the bare arm
  loses only the framework''s operating layer (AGENTS.md, schema, framework access). Both arms get identical
  tools, including Python, so arithmetic is not the discriminator. Every expected figure is produced by
  evals/generators/polar_station_htc.py; never edit them by hand.'

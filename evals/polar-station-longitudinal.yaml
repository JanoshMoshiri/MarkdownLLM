  \ records are markdown files with YAML frontmatter under things/:\nassemblies (things/assemblies/, id\
  \ asm-*: the layers of each construction, outside\nto inside), modules (things/modules/, id mod-*: use,\
  \ occupants, equipment load,\nvolume, HRV unit and its commissioning date, and each element with its\
  \ assembly,\narea and flags), heat-load assessments (things/heat-loads/, one per module) and the\nstation\
  \ budget (things/station-budget.md). The station is Skarvbreen Station, site\nclass P3. The governing\
  \ code is standard/htc-7.md.\n\nOutput contract, which the station's reporting reads:\n- Each module\
  \ mod-X has a heat-load thing with id hl-X (the module id with mod-\n  replaced by hl-), with frontmatter\
  \ fields net_load_w (integer watts),\n  design_load_kw, heater_kw (the rating of one unit), heater_units\
  \ (1 or 2), and\n  status computed once its figures are current.\n- The station budget, id station-budget,\
  \ has fields total_design_kw,\n  installed_kw, fuel_l_per_day, reserve_days and tank_count, and status\n\
  \  computed once its figures are current.\n- Figures are plain numbers in the frontmatter. Show your\
  \ working in the body.\n\nKeep the records correct as the station and the code change. Commit your changes\
  \ with git as you go."
